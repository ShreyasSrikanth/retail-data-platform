resources:
  jobs:
    Retail_data_platform:
      name: Retail-data-platform
      email_notifications:
        on_failure:
          - shreyassrikanth997@gmail.com
      schedule:
        quartz_cron_expression: 0 0 10 * * ?
        timezone_id: Europe/London
        pause_status: UNPAUSED
      tasks:
        - task_key: ingest_cosmosdb
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/ingestion/notebooks/cosmosdb-ingestion
            base_parameters:
              secret_scope: cosmosdb-ingestion
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/ingestion/configs/config_cosmosdb.json
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 900000
          disable_auto_optimization: false
          environment_key: platform
        - task_key: ingest_s3
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/ingestion/notebooks/s3-ingestion
            base_parameters:
              secret_scope: s3-ingestion-dev
              path: /Workspace//Users/shreyassrikanth997@gmail.com/retail-data-platform/src/ingestion/configs/config_s3.json
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 900000
          disable_auto_optimization: false
        - task_key: ingest_sqlserver
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/ingestion/notebooks/sql-server-ingestion
            base_parameters:
              secret_scope: retail-platform-dev
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/ingestion/configs/config_sqlserver.json
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 900000
          disable_auto_optimization: false
        - task_key: bronze
          depends_on:
            - task_key: ingest_cosmosdb
            - task_key: ingest_s3
            - task_key: ingest_sqlserver
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/bronze/notebooks/ds2b
            base_parameters:
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/bronze/config/config_ds2b.json
            source: WORKSPACE
        - task_key: silver_customers
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/silver/notebooks/b2s_customers
            base_parameters:
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/silver/config/config_b2s_customers.json
            source: WORKSPACE
        - task_key: gold_dim_customer
          depends_on:
            - task_key: silver_customers
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/notebooks/dim_customer
            base_parameters:
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/config/config_dim_customer.json
            source: WORKSPACE
        - task_key: silver_sales
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/silver/notebooks/b2s_sales
            base_parameters:
              path: /Workspace//Users/shreyassrikanth997@gmail.com/retail-data-platform/src/silver/config/config_b2s_sales.json
            source: WORKSPACE
        - task_key: gold_dim_date
          depends_on:
            - task_key: silver_sales
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/notebooks/dim_date
            base_parameters:
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/config/config_dim_date.json
            source: WORKSPACE
        - task_key: gold_dim_product
          depends_on:
            - task_key: silver_sales
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/notebooks/dim_product
            base_parameters:
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/config/config_dim_product.json
            source: WORKSPACE
        - task_key: silver_sales_orders
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/silver/notebooks/b2s_sales_orders
            base_parameters:
              path: /Workspace//Users/shreyassrikanth997@gmail.com/retail-data-platform/src/silver/config/config_b2s_sales_orders.json
            source: WORKSPACE
        - task_key: gold_fact_sales
          depends_on:
            - task_key: silver_sales
            - task_key: silver_sales_orders
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/notebooks/fact_sales
            base_parameters:
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/config/config_fact_sales.json
            source: WORKSPACE
        - task_key: gold_dim_order
          depends_on:
            - task_key: silver_sales_orders
          notebook_task:
            notebook_path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/notebooks/dim_order
            base_parameters:
              path: /Workspace/Users/shreyassrikanth997@gmail.com/retail-data-platform/src/gold/config/config_dim_order.json
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: platform
          spec:
            dependencies:
              - pymongo==4.10.1
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
